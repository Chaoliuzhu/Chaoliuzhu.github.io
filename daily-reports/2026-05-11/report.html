<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒店质检日报 - 2026年05月11日</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #f5f6fa; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                   color: white; padding: 30px; border-radius: 16px; margin-bottom: 24px; }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header .subtitle { opacity: 0.9; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                  gap: 16px; margin-bottom: 24px; }
        .stat-card { background: white; padding: 24px; border-radius: 12px;
                      box-shadow: 0 2px 12px rgba(0,0,0,0.08); text-align: center; }
        .stat-card .number { font-size: 36px; font-weight: bold; color: #333; }
        .stat-card .label { color: #666; margin-top: 8px; }
        .stat-card.warning .number { color: #e74c3c; }
        .stat-card.success .number { color: #27ae60; }
        .section { background: white; border-radius: 12px; padding: 24px; margin-bottom: 24px;
                    box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .section h2 { color: #333; margin-bottom: 16px; border-bottom: 2px solid #667eea;
                        padding-bottom: 8px; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .image-card { border: 1px solid #eee; border-radius: 8px; overflow: hidden; }
        .image-card img { width: 100%; height: 200px; object-fit: cover; }
        .image-card .info { padding: 12px; }
        .image-card .floor { font-weight: bold; color: #667eea; }
        .image-card .reason { color: #e74c3c; font-size: 14px; margin-top: 4px; }
        .empty { text-align: center; padding: 60px; color: #666; }
        .empty .emoji { font-size: 64px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏨 酒店质检日报</h1>
            <div class="subtitle">2026年05月11日 · 自动化生成</div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="number">3</div>
                <div class="label">今日检查总数</div>
            </div>
            <div class="stat-card success">
                <div class="number">3</div>
                <div class="label">合格</div>
            </div>
            <div class="stat-card warning">
                <div class="number">0</div>
                <div class="label">不合格</div>
            </div>
            <div class="stat-card">
                <div class="number">100%</div>
                <div class="label">合格率</div>
            </div>
        </div>

        <div class="section">
            <h2>📋 区域统计</h2>
            <div class="stats">

                <div class="stat-card">
                    <div class="number">3</div>
                    <div class="label">客房</div>
                </div>

            </div>
        </div>

        <div class="section">
            <h2>✅ 今日检查结果</h2>
            <div class="empty">
                <div class="emoji">🎉</div>
                <p>所有区域检查合格，继续保持！</p>
            </div>
        </div>

    </div>
</body>
</html>
